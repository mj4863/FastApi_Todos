<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>✨ To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Design Tokens ===== */
    :root{
      --bg:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --fg:#1a202c; --muted:#718096;
      --card:#ffffff; --border:#e2e8f0; --shadow:0 20px 60px rgba(0,0,0,.15);
      --primary:#667eea; --primary-hover:#5a67d8; --primary-weak:#eef2ff; --danger:#f56565;
      --success:#48bb78; --warning:#ed8936;
      --radius:16px; --ring:0 0 0 4px rgba(102,126,234,.2);
      color-scheme:light dark;
    }
    body.dark{
      --bg:linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
      --fg:#f7fafc; --muted:#a0aec0;
      --card:#2d3748; --border:#4a5568; --shadow:0 20px 60px rgba(0,0,0,.5);
      --primary:#7c3aed; --primary-hover:#6d28d9; --primary-weak:#2d1b69; --danger:#fc8181;
      --success:#68d391; --warning:#f6ad55;
      --ring:0 0 0 4px rgba(124,58,237,.3);
    }

    /* ===== Base ===== */
    *{box-sizing:border-box; margin:0; padding:0}
    body{
      font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color:var(--fg); background:var(--bg);
      background-attachment:fixed;
      min-height:100vh; display:grid; place-items:center;
      padding:clamp(20px,4vw,40px);
    }
    .app{
      width:min(920px,100%); background:var(--card);
      border-radius:24px; box-shadow:var(--shadow); overflow:hidden;
      backdrop-filter:blur(10px);
      animation:slideUp 0.5s ease-out;
    }
    @keyframes slideUp{
      from{ opacity:0; transform:translateY(20px) }
      to{ opacity:1; transform:translateY(0) }
    }
    header,.toolbar,footer{ padding:20px clamp(20px,4vw,32px); }
    header{
      display:flex; gap:12px; align-items:center;
      background:linear-gradient(to right, var(--primary-weak), transparent);
      border-bottom:2px solid var(--border);
    }
    h1{
      font-size:clamp(24px,3vw,32px); font-weight:700;
      background:linear-gradient(135deg, var(--primary), var(--primary-hover));
      -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .badge{
      padding:4px 12px; border-radius:999px;
      background:var(--primary); color:white;
      font-size:11px; font-weight:600; letter-spacing:0.5px;
      box-shadow:0 2px 8px rgba(102,126,234,.3);
    }

    .toolbar{
      display:flex; gap:12px; align-items:center; flex-wrap:wrap;
      background:rgba(102,126,234,.02);
      border-bottom:1px solid var(--border);
    }
    .spacer{ flex:1 1 auto }
    label{
      font-size:14px; font-weight:500; color:var(--muted);
      display:flex; align-items:center; gap:8px;
    }
    select{
      appearance:none; border:2px solid var(--border);
      background:var(--card); color:var(--fg);
      padding:10px 14px; border-radius:12px; outline:none;
      font-weight:500; cursor:pointer;
      transition:all 0.2s ease;
    }
    select:hover{ border-color:var(--primary) }
    select:focus-visible{ box-shadow:var(--ring); border-color:var(--primary) }

    .icon-btn{
      height:44px; width:44px; display:grid; place-items:center;
      border-radius:50%; border:2px solid var(--border);
      background:var(--card); cursor:pointer;
      transition:all 0.3s ease; font-size:20px;
    }
    .icon-btn:hover{
      background:var(--primary); border-color:var(--primary);
      transform:rotate(180deg) scale(1.1);
    }

    #status{
      color:var(--muted); font-size:13px; font-weight:500;
      padding:8px 16px; border-radius:999px;
      background:var(--primary-weak); border:2px solid var(--border);
    }

    /* Progress bar */
    .progress-container{
      background:var(--border); border-radius:999px; height:8px;
      overflow:hidden; margin-left:12px; width:120px;
    }
    .progress-bar{
      background:linear-gradient(90deg, var(--primary), var(--success));
      height:100%; border-radius:999px;
      transition:width 0.3s ease;
    }

    main{ padding:24px clamp(20px,4vw,32px) 28px }

    /* ===== List ===== */
    ul#todo-list{ list-style:none; display:grid; gap:12px }
    li.todo{
      display:grid; grid-template-columns:auto 1fr auto auto auto auto; align-items:center; gap:14px;
      border:2px solid var(--border); border-radius:var(--radius);
      padding:16px 18px; background:var(--card);
      transition:all 0.3s ease;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
    }
    li.todo:hover{
      border-color:var(--primary);
      box-shadow:0 8px 24px rgba(102,126,234,.15);
      transform:translateY(-2px);
    }
    input[type="checkbox"]{
      width:24px; height:24px; accent-color:var(--primary);
      cursor:pointer; border-radius:6px;
    }
    .text{
      overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
      font-weight:500; font-size:15px;
    }
    .done{
      background:rgba(72,187,120,.05);
      border-color:var(--success);
    }
    .done .text{ text-decoration:line-through; opacity:.65; color:var(--muted) }

    /* D-day badge */
    .dday-badge{
      padding:4px 10px; border-radius:999px;
      font-size:11px; font-weight:700; letter-spacing:0.3px;
      white-space:nowrap;
    }
    .dday-overdue{ background:#fecaca; color:#991b1b; }
    body.dark .dday-overdue{ background:#7f1d1d; color:#fca5a5; }
    .dday-today{ background:#fed7aa; color:#9a3412; }
    body.dark .dday-today{ background:#7c2d12; color:#fdba74; }
    .dday-soon{ background:#fef3c7; color:#92400e; }
    body.dark .dday-soon{ background:#78350f; color:#fcd34d; }
    .dday-normal{ background:#e0e7ff; color:#3730a3; }
    body.dark .dday-normal{ background:#312e81; color:#c7d2fe; }

    /* Overdue/Today highlighting */
    li.todo.overdue{ border-color:var(--danger); background:rgba(245,101,101,.03); }
    li.todo.today{ border-color:var(--warning); background:rgba(237,137,54,.03); }

    .btn{
      border:2px solid var(--border); background:var(--card); color:var(--fg);
      padding:10px 16px; border-radius:12px; cursor:pointer;
      font-weight:600; font-size:13px;
      transition:all 0.2s ease;
    }
    .btn:hover{
      background:var(--primary); color:white;
      border-color:var(--primary);
      transform:translateY(-1px);
      box-shadow:0 4px 12px rgba(102,126,234,.3);
    }
    .btn.danger{
      color:var(--danger); border-color:var(--danger);
      background:transparent;
    }
    .btn.danger:hover{
      background:var(--danger); color:white;
      box-shadow:0 4px 12px rgba(245,101,101,.3);
    }

    /* ===== Form / Error / Footer ===== */
    form{
      display:grid; grid-template-columns:1.2fr 1.5fr auto auto; gap:12px; align-items:center;
      border-top:2px dashed var(--border); padding-top:20px; margin-top:16px;
    }
    input[type="text"], input[type="date"]{
      border:2px solid var(--border); background:var(--card); color:var(--fg);
      padding:12px 16px; border-radius:12px; outline:none;
      font-weight:500; font-size:14px;
      transition:all 0.2s ease;
    }
    input[type="text"]::placeholder{ color:var(--muted); font-weight:400 }
    input[type="text"]:hover, input[type="date"]:hover{ border-color:var(--primary) }
    input[type="text"]:focus-visible, input[type="date"]:focus-visible{
      box-shadow:var(--ring); border-color:var(--primary);
      transform:translateY(-1px);
    }

    .err{
      margin-top:16px; color:#991b1b; background:#fee2e2; border:2px solid #fca5a5;
      padding:14px 18px; border-radius:12px; display:none;
      font-weight:500; font-size:14px;
      animation:shake 0.4s ease;
    }
    @keyframes shake{
      0%, 100%{ transform:translateX(0) }
      25%{ transform:translateX(-10px) }
      75%{ transform:translateX(10px) }
    }
    body.dark .err{ background:#450a0a; border-color:#7f1d1d; color:#fca5a5 }

    footer{
      border-top:2px solid var(--border);
      display:flex; justify-content:space-between;
      color:var(--muted); font-size:13px; font-weight:500;
      background:rgba(102,126,234,.02);
    }
    
    .inline-input{
      border:2px solid var(--border);
      background:var(--card);
      color:var(--fg);
      padding:8px 12px;
      border-radius:10px;
      outline:none;
      min-width:120px;
      font-weight:500;
      transition:all 0.2s ease;
    }
    .inline-input:hover{ border-color:var(--primary) }
    .inline-input:focus-visible{
      box-shadow:var(--ring); border-color:var(--primary);
      transform:translateY(-1px);
    }

    /* Year/Month Picker Popup */
    .picker-pop{
      position:absolute;
      background:var(--card);
      border:2px solid var(--primary);
      border-radius:16px;
      padding:16px;
      box-shadow:0 12px 40px rgba(0,0,0,.2);
      color:var(--fg);
      z-index:10;
      animation:fadeIn 0.2s ease;
    }
    @keyframes fadeIn{
      from{ opacity:0; transform:scale(0.95) }
      to{ opacity:1; transform:scale(1) }
    }

    .picker-title{
      font-weight:700;
      margin-bottom:10px;
      color:var(--primary);
      font-size:15px;
    }

    .picker-chip{
      border:2px solid var(--border);
      background:var(--card);
      border-radius:10px;
      padding:8px 12px;
      cursor:pointer;
      color:var(--fg);
      font-weight:600;
      transition:all 0.2s ease;
    }

    .picker-chip:hover{
      background:var(--primary);
      color:white;
      border-color:var(--primary);
      transform:scale(1.05);
    }

    .picker-grid{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:8px;
      margin-bottom:8px;
    }

    /* Calendar styling */
    #calendar .btn{
      transition:all 0.2s ease;
    }
    #calendar .btn:hover{
      transform:scale(1.05);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>To-Do List</h1>
      <span class="badge" id="app-version">v?.?.?</span>
    </header>

    <div class="toolbar">
      <label>
        Filter:
        <select id="filter">
          <option value="all">All</option>
          <option value="true">Completed</option>
          <option value="false">Active</option>
        </select>
      </label>
      <div id="calendar" style="margin-left:10px"></div>
      <div class="spacer"></div>
      <span id="status" role="status" aria-live="polite"></span>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar" style="width:0%"></div>
      </div>
      <button id="toggle-theme" class="icon-btn" title="Toggle dark mode">🌓</button>
    </div>

    <main>
      <ul id="todo-list" role="list"></ul>

      <form id="todo-form" autocomplete="off">
        <input id="title" type="text" placeholder="Title" required />
        <input id="description" type="text" placeholder="Description" required />
        <input id="duedate" type="date" title="Due Date" required />
        <button class="btn" type="submit">Add</button>
      </form>

      <div id="error" class="err" role="alert"></div>
    </main>

    <footer>
      <small>Made with FastAPI</small>
      <small>Press 🌓 to toggle theme</small>
    </footer>
  </div>

  <!-- Template reduces DOM boilerplate -->
  <template id="todo-tpl">
    <li class="todo" data-id="">
      <input class="chk" type="checkbox" />
      <span class="text"></span>
      <button class="btn edit" type="button">Edit</button>
      <button class="btn danger del" type="button">Delete</button>
    </li>
  </template>

  <script>
    // ===== State & Storage =====
    const $ = s => document.querySelector(s);
    const els = {
      list: $("#todo-list"), filter: $("#filter"), status: $("#status"),
      err: $("#error"), ver: $("#app-version"), themeBtn: $("#toggle-theme"),
      form: $("#todo-form"), title: $("#title"), desc: $("#description"),
      duedate: $("#duedate"),
      tpl: /** @type {HTMLTemplateElement} */ ($("#todo-tpl")),
      cal: $("#calendar"),
      progressBar: $("#progress-bar"),
    };

    // 날짜 헬퍼
    const iso = (y,m,d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const todayISO = () => iso(
      new Date().getFullYear(),
      new Date().getMonth() + 1,
      new Date().getDate()
    );

    // D-day 계산
    function calculateDday(dateStr) {
      const today = new Date(todayISO());
      const targetDate = new Date(dateStr);
      const diffTime = targetDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays;
    }

    // D-day 배지 생성
    function createDdayBadge(dday) {
      const badge = document.createElement('span');
      badge.className = 'dday-badge';

      if (dday < 0) {
        badge.classList.add('dday-overdue');
        badge.textContent = `${Math.abs(dday)}일 지남`;
      } else if (dday === 0) {
        badge.classList.add('dday-today');
        badge.textContent = '오늘';
      } else if (dday <= 3) {
        badge.classList.add('dday-soon');
        badge.textContent = `D-${dday}`;
      } else {
        badge.classList.add('dday-normal');
        badge.textContent = `D-${dday}`;
      }

      return badge;
    }
    const STORE = { FILTER:'todo-filter', THEME:'todo-theme', DATE:'todo-date' };
    
    const state = {
      get filter(){ return localStorage.getItem(STORE.FILTER) || 'all'; },
      set filter(v){ localStorage.setItem(STORE.FILTER, v); },
      get theme(){ return localStorage.getItem(STORE.THEME) || 'light'; },
      set theme(v){ localStorage.setItem(STORE.THEME, v); },
      get date(){ return localStorage.getItem(STORE.DATE) || todayISO(); },
      set date(v){ localStorage.setItem(STORE.DATE, v); },
      viewMonth: null, // {y,m} 현재 달력에 표시중인 월
    };
    if (state.theme === 'dark') document.body.classList.add('dark');
    els.filter.value = state.filter;

    // API: 날짜/필터 조합
    const api = {
      async request(path, opts){
        const r = await fetch(path, { headers:{'Content-Type':'application/json'}, ...opts });
        if (!r.ok){
          let msg = 'Request failed';
          try { const j = await r.json(); msg = j.detail || msg; } catch {}
          throw new Error(msg);
        }
        return r.status === 204 ? null : r.json();
      },

      list(date, filter){
        const q = new URLSearchParams();
        if (date) q.set('date', date);
        if (filter !== 'all') q.set('completed', filter);
        const qs = q.toString(); 
        return this.request(`/todos${qs ? `?${qs}` : ''}`);
      },

      updateDate(id, date){
        return this.request(`/todos/${id}/date`, {
          method: 'PATCH',
          body: JSON.stringify({ date })
        });
      },

      create(todo){ return this.request('/todos', { method:'POST', body:JSON.stringify(todo) }); },
      update(id, todo){ return this.request(`/todos/${id}`, { method:'PUT', body:JSON.stringify(todo) }); },
      remove(id){ return this.request(`/todos/${id}`, { method:'DELETE' }); },
      version(){ return this.request('/version'); }
    };

    // ===== UI helpers =====
    function showError(msg){
      els.err.textContent = msg; els.err.style.display = 'block';
      clearTimeout(showError.tid); showError.tid = setTimeout(()=> els.err.style.display='none', 3000);
    }
    const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;

    // 리스트 렌더 (data-date 보존)
    function renderList(todos){
      els.list.textContent = '';
      if (!todos.length){
        const empty = document.createElement('li');
        empty.className = 'todo'; empty.style.borderStyle='dashed'; empty.style.opacity='.7';
        empty.innerHTML = `<span class="text">No items on ${state.date}. Add your first to-do!</span>`;
        els.list.appendChild(empty);
        els.status.textContent = `0 items • 0 done • ${state.date}`;
        els.progressBar.style.width = '0%';
        return;
      }
      const frag = document.createDocumentFragment();
      let done = 0;
      for (const t of todos){
        if (t.completed) done++;
        const node = els.tpl.content.firstElementChild.cloneNode(true);
        node.dataset.id = t.id;
        node.dataset.date = t.date;
        node.dataset.title = t.title;
        node.dataset.description = t.description;
        if (t.completed) node.classList.add('done');
        node.querySelector('.chk').checked = !!t.completed;
        node.querySelector('.text').textContent = `${t.title}: ${t.description}`;

        // D-day 배지 추가
        const dday = calculateDday(t.date);
        const ddayBadge = createDdayBadge(dday);
        node.querySelector('.text').after(ddayBadge);

        // 기한 지남/오늘 강조
        if (!t.completed) {
          if (dday < 0) node.classList.add('overdue');
          else if (dday === 0) node.classList.add('today');
        }

        // Move 버튼 추가
        const delBtn = node.querySelector('.del');
        const moveBtn = document.createElement('button');
        moveBtn.className = 'btn move';
        moveBtn.type = 'button';
        moveBtn.textContent = 'Move';
        delBtn.before(moveBtn);

        frag.appendChild(node);
      }
      els.list.appendChild(frag);

      // 완료율 계산 및 표시
      const percent = todos.length > 0 ? Math.round((done / todos.length) * 100) : 0;
      els.status.textContent = `${done}/${todos.length} (${percent}%) • ${state.date}`;
      els.progressBar.style.width = `${percent}%`;
    }

    // 달력 렌더 (연/월 빠른 이동 + 일요일 시작)
    function renderCalendar(){
      // 상태 초기화
      const [selY, selM] = state.date.split('-').map(Number);
      if (!state.viewMonth) state.viewMonth = { y: selY, m: selM };

      const { y, m } = state.viewMonth; // m: 1~12
      const first = new Date(y, m-1, 1);
      const last  = new Date(y, m,   0);
      const startWeekday = first.getDay(); // 0=Sun ~ 6=Sat
      const days = last.getDate();

      // 루트 비우기
      els.cal.textContent = '';
      els.cal.style.position = 'relative';

      // ===== 헤더 =====
      const hdr = document.createElement('div');
      hdr.style.display='flex';
      hdr.style.gap='8px';
      hdr.style.alignItems='center';
      hdr.style.marginBottom='6px';

      const yPrev = document.createElement('button'); yPrev.className='btn'; yPrev.textContent='«';
      const mPrev = document.createElement('button'); mPrev.className='btn'; mPrev.textContent='‹';

      const titleBtn = document.createElement('button');
      titleBtn.className='btn';
      titleBtn.textContent = `${y}-${String(m).padStart(2,'0')} ▼`;
      titleBtn.style.cursor = 'pointer';
      titleBtn.title = 'Click to choose year/month';

      const mNext = document.createElement('button'); mNext.className='btn'; mNext.textContent='›';
      const yNext = document.createElement('button'); yNext.className='btn'; yNext.textContent='»';

      hdr.append(yPrev, mPrev, titleBtn, mNext, yNext);

      // === Today 버튼 추가 (달력 옆) ===
      const todayBtn = document.createElement('button');
      todayBtn.className = 'btn';
      todayBtn.textContent = 'Today';
      todayBtn.title = 'Jump to today';
      todayBtn.style.fontWeight = '600';

      // 🌈 스타일 추가 — 눈에 띄는 색상 (테마 호환)
      todayBtn.style.background = 'var(--primary)';
      todayBtn.style.color = 'white';
      todayBtn.style.border = 'none';
      todayBtn.style.fontWeight = '600';
      todayBtn.style.padding = '8px 14px';
      todayBtn.style.borderRadius = '10px';
      todayBtn.style.cursor = 'pointer';
      todayBtn.style.transition = 'all 0.2s ease';
      todayBtn.addEventListener('mouseover', () => todayBtn.style.opacity = '0.85');
      todayBtn.addEventListener('mouseout', () => todayBtn.style.opacity = '1');

      // 클릭 시: viewMonth 를 오늘 연/월로, state.date 를 오늘로 세팅 후 갱신
      todayBtn.addEventListener('click', () => {
        const now = new Date();
        const ty = now.getFullYear();
        const tm = now.getMonth() + 1;
        const td = now.getDate();

        state.viewMonth = { y: ty, m: tm };     // 달력 뷰를 오늘 연/월로
        state.date = iso(ty, tm, td);           // 선택일도 오늘로
        renderCalendar();                       // 달력 재렌더 (오늘로 스크롤/강조)
        load();                                 // 오늘 날짜의 todo 목록 로드
      });

      // 헤더의 맨 끝에 배치 (달력 옆)
      hdr.appendChild(todayBtn);

      els.cal.appendChild(hdr);

      // ===== 팝오버 (연/월 선택) =====
      let pop = null;
      let docHandler = null;

      function closePicker(){
        if (pop && pop.parentNode) pop.parentNode.removeChild(pop);
        pop = null;
        if (docHandler){
          document.removeEventListener('click', docHandler, true);
          docHandler = null;
        }
      }

      function openPicker(){
        closePicker(); // 하나만 열리도록

        // 현재 보이는 연도 묶음의 시작 연도(12년 단위 페이지네이션)
        let yearStart = y - 6; // 중앙정렬 느낌(현재 y가 가운데쯤)

        // 팝오버 DOM
        pop = document.createElement('div');
        pop.className = 'picker-pop';

        // 상단 바: 이전/다음 페이지 버튼 + 타이틀
        const topRow = document.createElement('div');
        topRow.style.display='flex';
        topRow.style.alignItems='center';
        topRow.style.justifyContent='space-between';
        topRow.style.gap='8px';

        const prevYears = document.createElement('button');
        prevYears.className = 'btn';
        prevYears.textContent = '⟨';

        const title = document.createElement('div');
        title.className = 'picker-title';
        // title 텍스트는 renderYearGrid에서 세팅

        const nextYears = document.createElement('button');
        nextYears.className = 'btn';
        nextYears.textContent = '⟩';

        topRow.append(prevYears, title, nextYears);
        pop.appendChild(topRow);

        // 연도 그리드
        const yGrid = document.createElement('div');
        yGrid.className = 'picker-grid';
        pop.appendChild(yGrid);

        // 하단 버튼들
        const closeBtn = document.createElement('button');
        closeBtn.className = 'btn';
        closeBtn.textContent = 'Close';
        closeBtn.style.marginTop = '8px';
        closeBtn.addEventListener('click', closePicker);
        pop.appendChild(closeBtn);

        // 그리드 그리는 함수 (현재 yearStart 기준 12개)
        function renderYearGrid(){
          const years = Array.from({length: 12}, (_,i)=> yearStart + i);
          // 타이틀: 범위 표시
          title.textContent = `${years[0]} – ${years[years.length-1]}`;

          yGrid.textContent = '';
          years.forEach(Y=>{
            const chip = document.createElement('button');
            chip.className = 'picker-chip';
            chip.textContent = String(Y);
            if (Y === y) chip.style.boxShadow = 'var(--ring)'; // 현재 표시 중인 연도 하이라이트
            chip.addEventListener('click', ()=> renderMonthPicker(Y));
            yGrid.appendChild(chip);
          });
        }

        // 페이지네이션: 12년 단위 이동
        prevYears.addEventListener('click', ()=>{
          yearStart -= 12;
          renderYearGrid();
        });
        nextYears.addEventListener('click', ()=>{
          yearStart += 12;
          renderYearGrid();
        });

        // 팝오버 위치: 제목 버튼 아래
        const rect = titleBtn.getBoundingClientRect();
        const calRect = els.cal.getBoundingClientRect();
        pop.style.top  = `${(rect.bottom - calRect.top) + 4}px`;
        pop.style.left = `${(rect.left   - calRect.left)}px`;

        els.cal.appendChild(pop);

        // 바깥 클릭 시 닫기 (중복 등록 방지)
        docHandler = (e)=>{
          if (!pop) return;
          if (!pop.contains(e.target) && e.target !== titleBtn) closePicker();
        };
        document.addEventListener('click', docHandler, true);

        // 최초 렌더
        renderYearGrid();
      }

      function renderMonthPicker(targetYear){
        pop.textContent = '';

        const t = document.createElement('div');
        t.className = 'picker-title';
        t.innerHTML = `<span>${targetYear} — Select Month</span>`;
        pop.appendChild(t);

        const mGrid = document.createElement('div');
        mGrid.className = 'picker-grid';
        for (let mm=1; mm<=12; mm++){
          const chip = document.createElement('button');
          chip.className = 'picker-chip';
          chip.textContent = String(mm).padStart(2,'0');
          if (targetYear === y && mm === m) chip.style.boxShadow = 'var(--ring)';
          chip.addEventListener('click', ()=>{
            state.viewMonth = { y: targetYear, m: mm };
            renderCalendar(); // 달력 리렌더
            closePicker();
          });
          mGrid.appendChild(chip);
        }
        pop.appendChild(mGrid);

        const backRow = document.createElement('div');
        backRow.style.display='flex';
        backRow.style.justifyContent='space-between';
        backRow.style.marginTop='8px';

        const backBtn = document.createElement('button');
        backBtn.className = 'btn'; backBtn.textContent = 'Back to Years';
        backBtn.addEventListener('click', openPicker);

        const closeBtn = document.createElement('button');
        closeBtn.className = 'btn'; closeBtn.textContent = 'Close';
        closeBtn.addEventListener('click', closePicker);

        backRow.append(backBtn, closeBtn);
        pop.appendChild(backRow);
      }

      titleBtn.addEventListener('click', ()=>{
        if (pop) closePicker(); else openPicker();
      });

      // 연/월 이동 버튼
      yPrev.addEventListener('click', ()=>{ state.viewMonth = { y: y-1, m }; renderCalendar(); });
      yNext.addEventListener('click', ()=>{ state.viewMonth = { y: y+1, m }; renderCalendar(); });
      mPrev.addEventListener('click', ()=>{ const nm = m===1 ? 12 : m-1; const ny = m===1 ? y-1 : y; state.viewMonth = { y: ny, m: nm }; renderCalendar(); });
      mNext.addEventListener('click', ()=>{ const nm = m===12 ? 1 : m+1; const ny = m===12 ? y+1 : y; state.viewMonth = { y: ny, m: nm }; renderCalendar(); });

      // ===== 요일 헤더 + 날짜 그리드 =====
      const grid = document.createElement('div');
      grid.style.display='grid';
      grid.style.gridTemplateColumns='repeat(7, minmax(28px, 1fr))';
      grid.style.gap='6px';

      const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']; // 일요일 시작
      for (const w of weekdays){
        const c = document.createElement('div');
        c.style.fontSize='12px';
        c.style.color='var(--muted)';
        c.textContent = w;
        grid.appendChild(c);
      }

      // 빈칸
      for (let i=0; i<startWeekday; i++) grid.appendChild(document.createElement('div'));

      // 오늘 날짜 계산 (YYYY-MM-DD)
      const today = todayISO();

      for (let d=1; d<=days; d++){
        const btn = document.createElement('button');
        btn.className='btn';
        btn.textContent = d;

        const thisISO = iso(y,m,d);
        btn.dataset.date = thisISO;

        // ✅ 오늘 날짜 강조 (라이트/다크 모두 잘 보이는 기본 스타일)
        if (thisISO === today) {
          btn.style.outline = '2px solid var(--primary)';
          btn.style.fontWeight = 'bold';
        }

        if (thisISO === state.date){
          btn.style.borderColor='var(--primary)';
          btn.style.boxShadow='var(--ring)';
        }
        btn.addEventListener('click', ()=>{
          state.date = thisISO;
          load();                  // 목록 갱신
          state.viewMonth = { y, m }; // 월 유지
          renderCalendar();
        });
        grid.appendChild(btn);
      }

      els.cal.appendChild(grid);
    }

    // ===== Actions =====
    async function load(){
      try {
        const todos = await api.list(state.date, state.filter);
        renderList(todos);
      } catch(e){ showError(e.message); }
    }

    function makeInput(value, placeholder){
      const i = document.createElement('input');
      i.type = 'text';
      i.className = 'inline-input';
      i.value = value ?? '';
      i.placeholder = placeholder ?? '';
      return i;
    }

    function startEdit(li){
      if (li.classList.contains('editing')) return;
      li.classList.add('editing');

      const textEl = li.querySelector('.text');
      const chk = li.querySelector('.chk');
      const editBtn = li.querySelector('.btn.save, .btn.edit') || li.querySelector('.edit');
      const delBtn = li.querySelector('.del');

      const curTitle = li.dataset.title ?? '';
      const curDesc  = li.dataset.description ?? '';
      const curDate  = li.dataset.date || state.date;   // 현재 날짜

      li.dataset._origTitle = curTitle;
      li.dataset._origDesc  = curDesc;
      li.dataset._origDate  = curDate;

      const wrap = document.createElement('span');
      wrap.className = 'inline-wrap';
      const titleInput = makeInput(curTitle, 'Title');
      const descInput  = makeInput(curDesc,  'Description');
      
      titleInput.name = 'edit-title';
      descInput.name  = 'edit-desc';

      // 날짜 입력 추가
      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.className = 'inline-input';
      dateInput.value = curDate;
      dateInput.name = 'edit-date';
      dateInput.style.minWidth = '140px';

      wrap.append(titleInput, descInput, dateInput);
      textEl.replaceWith(wrap);

      chk.disabled = true;

      editBtn.textContent = 'Save';
      editBtn.classList.add('save');
      editBtn.classList.remove('edit');

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn cancel';
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Cancel';
      delBtn.before(cancelBtn);

      function onKey(e){
        if (e.key === 'Enter'){ saveEdit(li); }
        else if (e.key === 'Escape'){ cancelEdit(li); }
      }
      titleInput.addEventListener('keydown', onKey);
      descInput.addEventListener('keydown', onKey);
      dateInput.addEventListener('keydown', onKey);

      titleInput.focus();
    }

    async function saveEdit(li){
      const id = Number(li.dataset.id);
      const completed = li.classList.contains('done');

      const title = li.querySelector('input[name="edit-title"]')?.value.trim() ?? '';
      const description = li.querySelector('input[name="edit-desc"]')?.value.trim() ?? '';
      // 날짜 읽기 (없으면 기존값 유지)
      const date = li.querySelector('input[name="edit-date"]')?.value || (li.dataset.date || state.date);

      if (!title || !description){
        showError('Title/Description required');
        return;
      }

      try{
        await api.update(id, { id, title, description, completed, date });
        await load();
      } catch(err){
        showError(err.message);
      }
    }

    function cancelEdit(li){
      const origTitle = li.dataset._origTitle ?? '';
      const origDesc  = li.dataset._origDesc ?? '';
      const origDate = (li.dataset._origDate ?? li.dataset.date) || state.date;

      const wrap = li.querySelector('.inline-wrap');
      const textEl = document.createElement('span');
      textEl.className = 'text';
      textEl.textContent = `${origTitle}: ${origDesc}`;
      wrap.replaceWith(textEl);

      const saveBtn = li.querySelector('.save');
      if (saveBtn){ saveBtn.textContent = 'Edit'; saveBtn.classList.add('edit'); saveBtn.classList.remove('save'); }
      const cancelBtn = li.querySelector('.cancel'); if (cancelBtn) cancelBtn.remove();

      const chk = li.querySelector('.chk'); chk.disabled = false;

      // dataset도 원복
      li.dataset.title = origTitle;
      li.dataset.description = origDesc;
      li.dataset.date = origDate;

      li.classList.remove('editing');
    }


    // 체크박스 토글 → date 포함해서 업데이트
    els.list.addEventListener('change', async (e)=>{
      const chk = e.target.closest('.chk'); if (!chk) return;
      const li = e.target.closest('.todo');
      const id = Number(li.dataset.id);
      const title = li.dataset.title ?? '';
      const description = li.dataset.description ?? '';
      const date = li.dataset.date || state.date;
      try { await api.update(id, { id, title, description, completed: chk.checked, date }); load(); }
      catch(err){ showError(err.message); chk.checked = !chk.checked; }
    });

    // 편집/삭제 → date 보존
    els.list.addEventListener('click', async (e)=>{
      const li = e.target.closest('.todo'); if (!li) return;
      const id = Number(li.dataset.id);
      const date = li.dataset.date || state.date;

      if (e.target.closest('.edit')){              // 기존: Edit → 인라인 편집 시작
        startEdit(li);
        return;
      }
      if (e.target.closest('.save')){              // 새로 추가: Save → 저장
        await saveEdit(li);
        return;
      }
      if (e.target.closest('.cancel')){            // 새로 추가: Cancel → 취소
        cancelEdit(li);
        return;
      }
      
      if (e.target.closest('.move')){
        // 간단히 prompt로 날짜 받기 (YYYY-MM-DD)
        const current = li.dataset.date || state.date;
        const newDate = prompt('Move to date (YYYY-MM-DD):', current);
        if (!newDate) return;

        try{
          await api.updateDate(id, newDate); // PATCH 호출
          state.date = newDate;   // ← 이동한 날짜로 달력/리스트도 전환
          await load();                      // 새 날짜에 맞춰 목록 갱신
        }catch(err){
          showError(err.message);
        }
        return;
      }

      if (e.target.closest('.del')){
        if (!confirm('Delete this item?')) return;
        try { await api.remove(id); load(); } catch(err){ showError(err.message); }
      }
    });

    // 새 항목 추가 시 사용자가 입력한 마감 날짜 사용
    els.form.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const title = els.title.value.trim();
      const description = els.desc.value.trim();
      const duedate = els.duedate.value; // YYYY-MM-DD 형식

      if (!title || !description || !duedate) {
        return showError('Title, Description, and Due Date are required');
      }

      const todo = { id: Date.now(), title, description, completed:false, date: duedate };
      try {
        await api.create(todo);
        els.form.reset();
        els.title.focus();
        load();
      }
      catch(err){ showError(err.message); }
    });

    els.filter.addEventListener('change', ()=>{ state.filter = els.filter.value; load(); });
    els.themeBtn.addEventListener('click', ()=>{
      document.body.classList.toggle('dark');
      state.theme = document.body.classList.contains('dark') ? 'dark' : 'light';
    });

    // 부팅
    (async function boot(){
      try { const v = await api.version(); els.ver.textContent = 'v'+(v.version||'unknown'); } catch {}
      renderCalendar();   // 달력 먼저
      await load();       // 선택일자 목록 로드
    })();


  </script>
</body>
</html>
